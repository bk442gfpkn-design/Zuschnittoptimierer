<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zuschnittoptimierer – Version 1.1</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172331;background:#f3f6f9}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:22px 14px 60px}h1{margin:0 0 6px;font-size:clamp(25px,4vw,36px)}.sub{color:#566779;margin:0 0 20px}.card{background:white;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #12243b10}h2{font-size:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-size:14px;font-weight:650;display:block;margin-bottom:5px}input{width:100%;padding:11px;border:1px solid #b9c6d1;border-radius:9px;font-size:17px}input:focus{outline:2px solid #2183c7}.row{display:grid;grid-template-columns:1fr 1fr 45px;gap:10px;align-items:end;margin-bottom:10px}button{border:0;border-radius:9px;padding:12px 15px;background:#12669e;color:white;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e8f0f7;color:#14577e}.delete{background:#fbe8e8;color:#a12626;padding:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint{font-size:13px;color:#617082}.error{color:#a51e28;font-weight:650}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:#edf5fb;border-radius:10px;padding:13px}.metric strong{display:block;font-size:25px;margin-top:5px}.metric span{font-size:13px;color:#506477}.pattern{border-top:1px solid #e2e8ee;padding:15px 0}.pattern:first-child{border-top:0}.pattern-title{font-weight:750;margin-bottom:8px}.bar{display:flex;width:100%;height:43px;border-radius:7px;overflow:hidden;border:1px solid #9fb3c2}.segment{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;font-size:12px;font-weight:750;border-right:2px solid white;color:#14283a}.rest{background:#e1e7ed!important;color:#536575}.details{font-size:14px;color:#516477;margin-top:7px}.badge{display:inline-block;background:#e4f5e9;color:#146537;padding:4px 9px;border-radius:20px;font-size:12px;margin-left:8px}.warn{background:#fff4d9;padding:12px;border-radius:9px;color:#705018;font-size:14px;margin-top:12px}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.card{padding:15px}.segment{font-size:10px}}
</style></head><body><main><h1>📐 Zuschnittoptimierer</h1><p class="sub">Längen optimal auf Rohmaterial verteilen – inklusive Sägeschnittbreite.</p><section class="card"><h2>Rohmaterial</h2><div class="grid"><div><label for="stock">Länge des Rohmaterials (mm)</label><input id="stock" type="number" min="1" step="any" value="3000"></div><div><label for="kerf">Schnittbreite (mm)</label><input id="kerf" type="number" min="0" step="any" value="3"></div></div><p class="hint">Nur notwendige Schnitte werden berechnet. Wenn das letzte Stück genau bis zum Ende reicht, entfällt der letzte Schnitt.</p></section><section class="card"><h2>Benötigte Teilstücke</h2><div id="parts"></div><div class="actions"><button class="secondary" type="button" id="add">+ Teilelänge hinzufügen</button><button type="button" id="calc">Zuschnitt berechnen</button></div><p id="error" class="error" role="alert"></p></section><section class="card" id="result" hidden><h2>Ergebnis <span id="quality"></span></h2><div class="metrics" id="metrics"></div><div id="notice"></div><h2 style="margin-top:22px">Schnittplan</h2><div id="patterns"></div><button class="secondary" onclick="window.print()">🖨️ Drucken</button></section></main><script>
const $=id=>document.getElementById(id);const fmt=n=>Number(n.toFixed(3)).toLocaleString('de-CH',{maximumFractionDigits:3});
function addRow(length='',count=''){const r=document.createElement('div');r.className='row';r.innerHTML='<div><label>Teilelänge (mm)</label><input class="length" type="number" min="0.001" step="any" value="'+length+'"></div><div><label>Anzahl</label><input class="count" type="number" min="1" step="1" value="'+count+'"></div><button class="delete" title="Entfernen" aria-label="Teilelänge entfernen">✕</button>';r.querySelector('button').onclick=()=>r.remove();$('parts').appendChild(r)}
$('add').onclick=()=>addRow();addRow(1200,2);addRow(800,4);
// A pattern with n parts uses n cuts if it leaves a remainder, but only n-1 if it exactly fills the stock.
function patternUsed(items,stock,kerf){let sum=items.reduce((s,x)=>s+x,0),n=items.length;let withLast=sum+n*kerf;if(withLast<=stock+1e-7)return {used:withLast,rest:Math.max(0,stock-withLast),cuts:n};let withoutLast=sum+(n-1)*kerf;if(Math.abs(withoutLast-stock)<=1e-7)return {used:stock,rest:0,cuts:n-1};return null}
function patternsFor(types,stock,kerf,cap=80000){let out=[],counts=Array(types.length).fill(0),seen=0;function dfs(i,sum,n){if(seen>cap)return;if(i===types.length){if(!n)return;let full=sum+n*kerf;let exact=Math.abs(sum+(n-1)*kerf-stock)<=1e-7;if(full<=stock+1e-7||exact){out.push({counts:[...counts],used:exact?stock:full,rest:exact?0:Math.max(0,stock-full),cuts:exact?n-1:n});seen++}return}let max=Math.min(types[i].count,Math.floor((stock-sum-(n? n:0)*kerf+kerf+1e-7)/(types[i].length+kerf)));max=Math.max(0,max);for(let q=max;q>=0;q--){counts[i]=q;dfs(i+1,sum+q*types[i].length,n+q);if(seen>cap)break}counts[i]=0}dfs(0,0,0);return {out,truncated:seen>cap}}
function heuristic(types,stock,kerf){let items=[];types.forEach((t,i)=>{for(let q=0;q<t.count;q++)items.push({length:t.length,type:i})});items.sort((a,b)=>b.length-a.length);let bins=[];for(let item of items){let best=-1,bestRest=Infinity;for(let i=0;i<bins.length;i++){let candidate=patternUsed([...bins[i].items.map(x=>x.length),item.length],stock,kerf);if(candidate&&candidate.rest<bestRest){best=i;bestRest=candidate.rest}}if(best<0)bins.push({items:[item]});else bins[best].items.push(item)}return bins.map(b=>({counts:types.map((_,i)=>b.items.filter(x=>x.type===i).length),...patternUsed(b.items.map(x=>x.length),stock,kerf)}))}
// Exact branch-and-bound over all feasible patterns. Time/node budget prevents hanging on phones.
function optimize(types,stock,kerf){let total=types.reduce((s,t)=>s+t.count,0),weight=types.reduce((s,t)=>s+t.length*t.count,0),generated=patternsFor(types,stock,kerf);let greedy=heuristic(types,stock,kerf),best=greedy,bestN=greedy.length;let lower=Math.ceil((weight-1e-7)/stock);if(bestN===lower)return {solution:best,exact:true};if(generated.truncated||generated.out.length>14000||total>130)return {solution:best,exact:false};let pats=generated.out.sort((a,b)=>b.used-a.used),remaining=types.map(t=>t.count),maxPieces=types.map((_,i)=>Math.max(...pats.map(p=>p.counts[i]))),nodes=0,deadline=performance.now()+2300,aborted=false;function dfs(path){if(++nodes>180000||performance.now()>deadline){aborted=true;return}let need=remaining.reduce((a,b)=>a+b,0);if(!need){if(path.length<bestN){bestN=path.length;best=path.slice()}return}let remWeight=remaining.reduce((s,q,i)=>s+q*types[i].length,0);let lb=Math.max(Math.ceil((remWeight-1e-7)/stock),...remaining.map((q,i)=>Math.ceil(q/maxPieces[i])));if(path.length+lb>=bestN)return;let target=remaining.findIndex(q=>q>0);let options=pats.filter(p=>p.counts[target]>0&&p.counts.every((q,i)=>q<=remaining[i]));for(let p of options){for(let i=0;i<remaining.length;i++)remaining[i]-=p.counts[i];path.push(p);dfs(path);path.pop();for(let i=0;i<remaining.length;i++)remaining[i]+=p.counts[i];if(aborted)return}}dfs([]);return {solution:best,exact:!aborted}}
$('calc').onclick=()=>{let err=$('error');err.textContent='';$('result').hidden=true;let stock=Number($('stock').value),kerf=Number($('kerf').value),rows=[...document.querySelectorAll('#parts .row')],types=[];if(!(stock>0)||!Number.isFinite(stock)||!(kerf>=0)||!Number.isFinite(kerf)){err.textContent='Bitte gültige Werte für Rohmaterial und Schnittbreite eingeben.';return}for(let r of rows){let l=Number(r.querySelector('.length').value),c=Number(r.querySelector('.count').value);if(!(l>0)||!Number.isFinite(l)||!Number.isInteger(c)||c<1){err.textContent='Bitte alle Teilelängen und Stückzahlen korrekt eingeben.';return}if(l>stock+1e-7){err.textContent='Ein Teilstück ist länger als das Rohmaterial.';return}if(l<stock-1e-7&&l+kerf>stock+1e-7){err.textContent='Teilstück '+fmt(l)+' mm ist nicht zuschneidbar: Für den notwendigen Trennschnitt fehlen '+fmt(l+kerf-stock)+' mm Rohmaterial.';return}types.push({length:l,count:c})}if(!types.length){err.textContent='Bitte mindestens eine Teilelänge hinzufügen.';return}if(types.reduce((s,t)=>s+t.count,0)>1500){err.textContent='Maximal 1500 Teilstücke pro Berechnung.';return}let merged=new Map();for(let t of types)merged.set(t.length,(merged.get(t.length)||0)+t.count);types=[...merged].map(([length,count])=>({length,count})).sort((a,b)=>b.length-a.length);let {solution,exact}=optimize(types,stock,kerf);let totalCuts=solution.reduce((s,p)=>s+p.cuts,0),partsLength=types.reduce((s,t)=>s+t.length*t.count,0),waste=solution.length*stock-partsLength,cutLoss=totalCuts*kerf,offcuts=Math.max(0,waste-cutLoss),util=100*partsLength/(solution.length*stock);$('quality').innerHTML=exact?'<span class="badge">Optimalität nachgewiesen</span>':'<span class="badge" style="background:#fff2d5;color:#795415">Guter Zuschnittvorschlag</span>';$('metrics').innerHTML=[['Rohmaterial-Stücke',solution.length],['Materialausnutzung',fmt(util)+' %'],['Reststücke gesamt',fmt(offcuts)+' mm'],['Sägeschnittverlust',fmt(cutLoss)+' mm']].map(([k,v])=>'<div class="metric"><span>'+k+'</span><strong>'+v+'</strong></div>').join('');$('notice').innerHTML=exact?'':'<div class="warn">Bei dieser Auftragsgrösse konnte die mathematische Optimalität nicht nachgewiesen werden. Der Plan ist gültig, aber eventuell gibt es eine bessere Aufteilung.</div>';let groups=new Map();for(let p of solution){let key=p.counts.join(',');if(!groups.has(key))groups.set(key,{p,n:0});groups.get(key).n++}let html='';for(let {p,n} of groups.values()){let items=[];p.counts.forEach((q,i)=>{for(let j=0;j<q;j++)items.push(types[i].length)});let segs=items.map((l,i)=>'<div class="segment" style="width:'+100*l/stock+'%;background:hsl('+(195+i*53)%360+' 65% 75%)" title="'+fmt(l)+' mm">'+(l/stock>.075?fmt(l):'')+'</div>').join('');if(p.rest>1e-7)segs+='<div class="segment rest" style="width:'+100*p.rest/stock+'%" title="Rest '+fmt(p.rest)+' mm">'+(p.rest/stock>.075?fmt(p.rest):'')+'</div>';html+='<div class="pattern"><div class="pattern-title">'+n+' × Rohmaterial à '+fmt(stock)+' mm</div><div class="bar">'+segs+'</div><div class="details">'+items.map(l=>fmt(l)+' mm').join(' + ')+' · '+p.cuts+' Schnitt(e) · Reststück '+fmt(p.rest)+' mm</div></div>'}$('patterns').innerHTML=html;$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'start'})};
</script></body></html>
